name: Daily research

on:
  schedule:
    # 22:30 UTC Mon–Fri: after the US close (Indian markets closed at 10:00 UTC).
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      only:
        description: 'Only these tickers (comma-separated, optional)'
        required: false
  push:
    branches: [main]
    paths-ignore:
      - 'site/public/data/**'
      - '**.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Research watchlist
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            node pipeline/build.js --only "${{ github.event.inputs.only }}"
          else
            node pipeline/build.js
          fi

      - name: Commit research data
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add site/public/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: research refresh $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
